---
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} · namedfile ${{ matrix.namedfile.label }}.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        # plone.namedfile 7.x and 8.x put a *different* ImageScale method on
        # the live path — scaling._HAS_SCALE_URL forks on it — so a suite
        # that only ever sees one of them tests half the package. There is
        # no lockfile here, so an unconstrained resolve gets 8.x while
        # production runs 7.x, which is the half that was never covered.
        namedfile:
          - {spec: "<8", label: "7"}
          - {spec: ">=8", label: "8"}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[test]" "plone.namedfile${{ matrix.namedfile.spec }}"

      - name: Verify the pin took
        run: |
          uv run --no-sync python -c "
          import importlib.metadata as m
          from plone.namedfile.scaling import ImageScale
          print('plone.namedfile', m.version('plone.namedfile'),
                '| _HAS_SCALE_URL =', hasattr(ImageScale, '_scale_url'))
          "

      - name: Run tests with coverage
        # --no-sync is load-bearing. A plain `uv run` re-resolves from
        # pyproject.toml, silently replacing the pin above, and the matrix
        # would then run 8.x in all four jobs while claiming to cover both.
        run: uv run --no-sync pytest --cov --cov-report=

      - name: Rename coverage data
        run: mv .coverage .coverage.${{ matrix.python-version }}-nf${{ matrix.namedfile.label }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.python-version }}-nf${{ matrix.namedfile.label }}
          path: .coverage.${{ matrix.python-version }}-nf${{ matrix.namedfile.label }}
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Combine & check coverage
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[test]"

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage & check threshold
        run: |
          uv run coverage combine
          uv run coverage html --skip-covered --skip-empty
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          uv run coverage report

      - name: Upload HTML report if check failed
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: htmlcov
        if: ${{ failure() }}
